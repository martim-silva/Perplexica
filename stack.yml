name: perplexica
category: search
layer: application
host: mac
domain: research
status: active
modifiers:
- ctw
- tower
networks:
- ai
- traefik
- monitoring
boot_priority: 50
gate:
  target: perplexica
  type: healthy
  timeout: 120
kind: deployment
consumes:
- inference
provides:
- research
ingress:
- host: perplexica.localhost
  port: 3000
  cf_hostname: perplexica.mhs-cloud.com
builds:
  - name: perplexica-api
    context: .
    dockerfile: backend.dockerfile
  - name: perplexica
    context: .
    dockerfile: app.dockerfile
