  # Perplexica's own SearXNG instance — separate from Open WebUI's
  # Perplexica expects SearXNG at a specific URL configured in the backend
  perplexica-searxng:
    image: docker.io/searxng/searxng:latest
    container_name: perplexica-searxng
    restart: unless-stopped
    volumes:
      - searxng-data:/etc/searxng
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ai
      - monitoring

